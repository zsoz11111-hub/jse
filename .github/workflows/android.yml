name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "assets/icon-512.png"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

# 빌드가 겹치면 서명 키가 두 번 만들어질 수 있어 하나씩 실행합니다.
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 같은 서명 키를 계속 써야 앱을 지우지 않고 업데이트할 수 있습니다.
      # 키가 아직 없으면 한 번만 만들어 저장소에 넣고, 이후에는 그 키를 꺼내 씁니다.
      - name: Signing key
        run: |
          if [ ! -f android/signing/jse.keystore.b64 ]; then
            mkdir -p android/signing
            keytool -genkeypair -keystore /tmp/jse.keystore -storepass jse-app-2026 -keypass jse-app-2026 \
              -alias jse -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=jse, O=jse, C=KR"
            base64 -w0 /tmp/jse.keystore > android/signing/jse.keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/signing/jse.keystore.b64
            git commit -m "앱 서명 키 고정"
            git push
          fi
          base64 -d android/signing/jse.keystore.b64 > android/app/jse.keystore

      - name: App icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk jse-app.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 갤럭시 앱 (최신)
          body: 갤럭시 폰에서 아래 jse-app.apk 를 눌러 받은 뒤 설치하세요.
          files: jse-app.apk
          make_latest: true
