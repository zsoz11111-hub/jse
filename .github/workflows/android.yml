name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "assets/icon-512.png"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 같은 서명 키를 계속 써야 앱을 지우지 않고 업데이트할 수 있습니다.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jse-debug-keystore

      - name: App icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk jse-app.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 갤럭시 앱 (최신)
          body: 갤럭시 폰에서 아래 jse-app.apk 를 눌러 받은 뒤 설치하세요.
          files: jse-app.apk
          make_latest: true
